syntax = "proto3";

package standard;

import "google/api/annotations.proto";

// A custom rule becomes an operation when OpenAPI has one for its method.
service CustomMethodsService {
  rpc CheckDocument(CheckDocumentRequest) returns (CheckDocumentResponse) {
    option (google.api.http) = {
      custom: {
        kind: "HEAD"
        path: "/v1/documents/{id}"
      }
      additional_bindings: {
        custom: {
          kind: "options"
          path: "/v1/documents/{id}"
        }
      }
    };
  }
  rpc TraceDocument(CheckDocumentRequest) returns (CheckDocumentResponse) {
    option (google.api.http) = {
      custom: {
        kind: "TRACE"
        path: "/v1/documents/{id}:trace"
      }
    };
  }
  // OpenAPI has no operation for this method, so the rule is skipped and
  // the method is documented at its Connect route.
  rpc LockDocument(CheckDocumentRequest) returns (CheckDocumentResponse) {
    option (google.api.http) = {
      custom: {
        kind: "LOCK"
        path: "/v1/documents/{id}:lock"
      }
    };
  }
}

message CheckDocumentRequest {
  string id = 1;
}

message CheckDocumentResponse {
  string etag = 1;
}
